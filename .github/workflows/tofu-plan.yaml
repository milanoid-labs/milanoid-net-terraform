name: Tofu Plan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency
  group: tofu-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: homelab-runners
    
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.TF_VAR_CLOUDFLARE_API_TOKEN }}
  
    steps:
      - name: checkout
        id: checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: setup opentufu
        id: setup-opentofu
        uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2.0.1
        with:
          tofu_version: "1.12.2"
          # The wrapper shells out via `env node`, but our self-hosted runner
          # has no system Node on PATH. We don't read step outputs, so disable it.
          tofu_wrapper: false
    
      - name: configure aws credentials
        id: configure-aws-credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}

      - name: tofu init
        id: tofu-init
        run: tofu init

      - name: tofu plan
        id: tofu-plan
        run: tofu plan
